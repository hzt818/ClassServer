# ============================================================
# 我的课堂·教室服务站 配置文件（发布模板）
# 使用方法：把本文件重命名/另存为 config.properties 后按需修改。
# 注意：qwen.api_key 与 jwt.secret 仅保存在教师本机，请勿外传。
# ============================================================

# SQLite 嵌入式数据库文件路径（无需安装/配置任何数据库服务）
db.path=./data/classroom.db
db.max_conns=10

# 服务监听端口（VisualClassroom 主程序 WebSocket 使用 8899，这里错开用 8900）。
app.port=8900

app.timezone=Asia/Shanghai

# AI 能力（通义千问）API Key：请填入您自己的 Key（获取：https://bailian.console.aliyun.com）
# 留空时 AI 批改/绘图/语音转写功能不可用，其余功能不受影响。
# 注意：此 Key 仅保存在教师本机，不会随程序分发；泄露会被他人盗用产生费用。
qwen.api_key=

# 同时批改的作文数上限：批量导入时多篇文章并行批改，值越大总耗时越短，
# 但太大会触发通义千问限流（429）。默认 6，最大 16。
# qwen.grading_concurrency=6

# JWT 签名密钥：留空时服务首次启动会自动生成随机密钥并写回 config.properties，
# 请勿与他人共享（否则任何人可伪造登录凭据）。
jwt.secret=

app.domain=
app.email=

# 调试账户预置开关：打开后首次初始化会创建 admin01~admin10（教师）与
# u001~u100（学生）共 110 个调试账户（随机初始密码，清单写入 data/initial_accounts.txt）。
# 默认关闭——正式使用不预置任何账户，教师通过注册流程建号，学生在账号管理中创建。
app.seed_demo_accounts=false

# ---------- 聊天室 AI：Bing 本地搜索 与 文生图模型 ----------
# 聊天室 @AI 提问时，服务器本地检索 Bing 并把结果注入回答（可标注来源）。
# 未配置官方 API 密钥时自动使用免密的必应网页检索（默认 cn.bing.com）。
search.bing_enabled=true
# 可选：Bing Web Search API v7 密钥（https://api.bing.microsoft.com），
# 配置后走官方 API，比网页抓取更稳定（付费服务）。
search.bing_api_key=
# 每次注入的搜索结果条数（1~10，默认 5）
search.bing_count=5
# 聊天室"画：xxx"文生图模型（默认 qwen-image-3.0；
# 若 DashScope 提示模型不存在，可改回 wanx2.1-t2i-turbo）
qwen.image_model=qwen-image-3.0

# ---------- 调试开关（正式使用请保持关闭） ----------
# build.dev 是所有 [DEVELOPMENT] 提示日志的总开关。默认关闭。
build.dev=false
# 语音聊天室开发人员开关。打开需同时 build.dev=true。默认关闭。
voice.dev=false
# 开发者调试控制台开关。默认关闭。
console.dev=false

# ---------- 支付宝实名认证（教师自助注册身份核验） ----------
# 到支付宝开放平台创建"小程序/应用"并签约"实名认证"服务后填写：
alipay.app_id=
# 应用私钥（PKCS1/PKCS8 PEM，或控制台导出的裸 base64）
alipay.private_key=
# 支付宝公钥（用于响应验签；不是你的应用公钥）
alipay.alipay_public_key=
# 网关（沙箱调试可换 https://openapi-sandbox.dl.alipaydev.com/gateway.do）
alipay.gateway_url=https://openapi.alipay.com/gateway.do
# 未配置密钥时的本地模拟认证开关（仅开发调试；正式使用必须关闭）
alipay.mock=false
