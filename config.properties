# SQLite 嵌入式数据库文件路径（无需安装/配置任何数据库服务）
db.path=./data/classroom.db
db.max_conns=10

# 服务监听端口（VisualClassroom 主程序 WebSocket 使用 8899，这里错开用 8900）。
app.port=8900

app.timezone=Asia/Shanghai

# AI 能力（通义千问）API Key：请填入您自己的 Key（获取：https://bailian.console.aliyun.com）
# 注意：此 Key 仅保存在教师本机，不会随程序分发；泄露会被他人盗用产生费用。
qwen.api_key=sk-d34815f1017e40ce86269e822b9953f1
# 模型选型（留空用默认：文本 qwen3.8-flash / 视觉 qwen3-vl-plus / 兜底 qwen3.8-flash）
qwen.text_model=
qwen.vision_model=
qwen.fallback_model=
# JWT 签名密钥：首次启动会自动生成并写回此文件，请勿与他人共享。
jwt.secret=

app.domain=
app.email=
# Test features #
# build.dev 是所有 [DEVELOPMENT] 提示日志的总开关。默认关闭。
build.dev=true
# 语音聊天室开发人员开关。打开且 build.dev=true；默认关闭。
voice.dev=true
# 开发者调试控制台开关。打开后进程会在标准输出/输入上常驻一个简易滚动控制台：occupy，默认关闭。
console.dev=true

# ---------- 支付宝实名认证（教师自助注册身份核验） ----------
# 接入真实渠道：到支付宝开放平台签约"实名认证"，填写以下三项并关闭 mock。
# alipay.app_id=
# alipay.private_key=
# alipay.alipay_public_key=
# alipay.gateway_url=https://openapi.alipay.com/gateway.do
# 本机未配置密钥，开启本地模拟认证（仅开发用）：
alipay.mock=true
